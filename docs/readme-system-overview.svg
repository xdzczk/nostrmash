<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">NostrMash system overview</title>
  <desc id="desc">Relays feed the ingestor, which writes canonical data to Postgres. Jobs and trust processing build read models that power both native and Primal-compatible API surfaces.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#f3f7fc"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <style>
      .panel { fill: url(#bg); stroke: #dbe7f5; stroke-width: 1.5; filter: url(#shadow); }
      .group { fill: #ffffff; stroke: #d7e3f2; stroke-width: 1.5; filter: url(#shadow); }
      .core { fill: #eff6ff; stroke: #93c5fd; stroke-width: 1.5; }
      .support { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
      .trust { fill: #f0fdf4; stroke: #86efac; stroke-width: 1.5; }
      .api { fill: #ecfeff; stroke: #67e8f9; stroke-width: 1.5; }
      .compat { fill: #f5f3ff; stroke: #c4b5fd; stroke-width: 1.5; }
      .kicker { font: 600 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0.08em; text-transform: uppercase; fill: #475569; }
      .title { font: 700 34px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 500 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .label { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .body { font: 500 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .small { font: 600 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; letter-spacing: 0.04em; text-transform: uppercase; }
      .arrow { stroke: url(#ink); stroke-width: 3.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .soft-arrow { stroke: #94a3b8; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 7 7; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto">
      <polygon points="0 0, 7 3.5, 0 7" fill="#1d4ed8"/>
    </marker>
    <marker id="soft-arrowhead" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto">
      <polygon points="0 0, 7 3.5, 0 7" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect x="20" y="20" width="1160" height="380" rx="28" class="panel"/>

  <text x="56" y="66" class="kicker">NostrMash architecture</text>
  <text x="56" y="106" class="title">Own the data plane. Keep the client boundary compatible.</text>
  <text x="56" y="136" class="subtitle">Canonical Nostr truth stays durable in Postgres while rebuildable views and compatibility surfaces stay free to evolve.</text>

  <rect x="56" y="176" width="1088" height="180" rx="22" class="group"/>
  <text x="82" y="204" class="small">Self-hosted stack</text>

  <rect x="82" y="226" width="140" height="78" rx="18" class="support"/>
  <text x="102" y="255" class="label">Relays</text>
  <text x="102" y="277" class="body">live sources</text>
  <text x="102" y="296" class="body">backfill inputs</text>

  <rect x="260" y="226" width="158" height="78" rx="18" class="core"/>
  <text x="282" y="255" class="label">Ingestor</text>
  <text x="282" y="277" class="body">validate payloads</text>
  <text x="282" y="296" class="body">write canonical rows</text>

  <rect x="456" y="214" width="190" height="92" rx="18" class="core"/>
  <text x="478" y="246" class="label">Canonical Postgres</text>
  <text x="478" y="269" class="body">events, tags, checkpoints</text>
  <text x="478" y="288" class="body">jobs, projections, trust outputs</text>

  <rect x="686" y="226" width="128" height="78" rx="18" class="support"/>
  <text x="718" y="255" class="label">Jobs</text>
  <text x="718" y="277" class="body">queued work</text>
  <text x="718" y="296" class="body">rebuildable flow</text>

  <rect x="850" y="214" width="144" height="92" rx="18" class="core"/>
  <text x="873" y="246" class="label">Worker</text>
  <text x="873" y="269" class="body">derive state</text>
  <text x="873" y="288" class="body">materialize views</text>

  <rect x="1028" y="214" width="90" height="92" rx="18" class="api"/>
  <text x="1047" y="252" class="label">API</text>
  <text x="1047" y="275" class="body">native</text>
  <text x="1047" y="294" class="body">reads</text>

  <rect x="850" y="324" width="144" height="44" rx="14" class="trust"/>
  <text x="872" y="352" class="label">Trust worker</text>

  <rect x="686" y="324" width="128" height="44" rx="14" class="trust"/>
  <text x="719" y="352" class="label">Redis</text>

  <rect x="1028" y="324" width="90" height="44" rx="14" class="compat"/>
  <text x="1043" y="352" class="label">Primal</text>

  <path d="M222 265 H260" class="arrow" marker-end="url(#arrowhead)"/>
  <path d="M418 265 H456" class="arrow" marker-end="url(#arrowhead)"/>
  <path d="M646 265 H686" class="arrow" marker-end="url(#arrowhead)"/>
  <path d="M814 265 H850" class="arrow" marker-end="url(#arrowhead)"/>
  <path d="M994 260 H1028" class="arrow" marker-end="url(#arrowhead)"/>

  <path d="M551 306 V346 H686" class="soft-arrow" marker-end="url(#soft-arrowhead)"/>
  <path d="M814 346 H850" class="soft-arrow" marker-end="url(#soft-arrowhead)"/>
  <path d="M994 346 H1028" class="soft-arrow" marker-end="url(#soft-arrowhead)"/>

  <text x="478" y="339" class="small">Durable truth</text>
  <text x="686" y="392" class="small">Disposable trust working state</text>
  <text x="1028" y="392" class="small">Drop-in compatibility boundary</text>
</svg>
