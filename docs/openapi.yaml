openapi: 3.0.3
info:
  title: NostrMash API
  version: 0.15.0
  description: Native, admin, and Primal compatibility APIs.
servers:
  - url: /
tags:
  - name: public
  - name: admin
  - name: primal
paths:
  /health:
    get:
      tags: [public]
      summary: Liveness probe
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                required: [status]
  /ready:
    get:
      tags: [public]
      summary: Readiness probe
      responses:
        '200':
          description: Database is reachable
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ready }
                required: [status]
        '503':
          $ref: '#/components/responses/Error'
  /metrics:
    get:
      tags: [public]
      summary: Prometheus metrics exposition
      responses:
        '200':
          description: Prometheus text format metrics

  /api/v1/events/{id}:
    get:
      tags: [public]
      summary: Get canonical event plus relay provenance
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Event and provenance
          content:
            application/json:
              schema:
                type: object
                properties:
                  event:
                    type: object
                    additionalProperties: true
                  provenance:
                    type: object
                    properties:
                      relays:
                        type: array
                        items:
                          type: object
                          properties:
                            relay_url: { type: string }
                            seen_at: { type: string, format: date-time }
                  consistency: { type: string, enum: [strong] }
                required: [event, provenance, consistency]
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/events/batch:
    post:
      tags: [public]
      summary: Batch fetch canonical events
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  items: { type: string }
              required: [ids]
      responses:
        '200':
          description: Found and missing events
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  missing:
                    type: array
                    items: { type: string }
                required: [events, missing]
        '400':
          $ref: '#/components/responses/Error'
  /api/v1/events/{id}/seen-on:
    get:
      tags: [public]
      summary: Get relay provenance for one event
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Seen-on rows
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/events/{id}/counts:
    get:
      tags: [public]
      summary: Get eventual interaction counters
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Reply/reaction/repost counters
  /api/v1/events/{id}/replies:
    get:
      tags: [public]
      summary: Get direct replies with cursor pagination
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - in: query
          name: cursor
          schema: { type: string }
      responses:
        '200':
          description: Reply page
  /api/v1/events/{id}/ancestors:
    get:
      tags: [public]
      summary: Get root-to-parent chain
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: query
          name: max_depth
          schema: { type: integer, minimum: 1, maximum: 100, default: 100 }
      responses:
        '200':
          description: Ancestor chain with missing IDs
  /api/v1/threads/{eventId}:
    get:
      tags: [public]
      summary: Get thread slice for one event
      parameters:
        - in: path
          name: eventId
          required: true
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - in: query
          name: max_depth
          schema: { type: integer, minimum: 1, maximum: 100, default: 100 }
        - in: query
          name: cursor
          schema: { type: string }
      responses:
        '200':
          description: Thread view
  /api/v1/threads/{root_event_id}/summary:
    get:
      tags: [public]
      summary: Get root-level thread summary projection
      parameters:
        - in: path
          name: root_event_id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Thread summary primitives and velocity hints
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/threads/{root_event_id}/activity:
    get:
      tags: [public]
      summary: Get root-level thread activity hotspot metrics
      parameters:
        - in: path
          name: root_event_id
          required: true
          schema: { type: string }
        - in: query
          name: window
          schema: { type: string, enum: [24h, 7d], default: 24h }
      responses:
        '200':
          description: Thread activity snapshot with velocity score
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/notes/{event_id}/summary:
    get:
      tags: [public]
      summary: Product-shaped summary payload for one note page
      parameters:
        - in: path
          name: event_id
          required: true
          schema: { type: string }
        - in: query
          name: include_activity
          schema: { type: boolean, default: true }
      responses:
        '200':
          description: Note payload with author summary, counts, thread context, quote/repost context, and optional conversation activity
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/notes/{event_id}/related:
    get:
      tags: [public]
      summary: Bounded related notes for one focal note
      parameters:
        - in: path
          name: event_id
          required: true
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
      responses:
        '200':
          description: Related note cards with bounded heuristic reasons
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/profiles/{pubkey}:
    get:
      tags: [public]
      summary: Get projected latest profile
      parameters:
        - in: path
          name: pubkey
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Profile projection
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/profiles/{pubkey}/topics:
    get:
      tags: [public]
      summary: Profile topic affinity rows from author analytics rollups
      parameters:
        - in: path
          name: pubkey
          required: true
          schema: { type: string }
        - in: query
          name: window
          schema: { type: string, enum: [7d, 30d, 90d], default: 30d }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Profile topic usage rows for the selected window
        '400':
          $ref: '#/components/responses/Error'
  /api/v1/profiles/batch:
    post:
      tags: [public]
      summary: Batch get profile projections
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pubkeys:
                  type: array
                  items: { type: string }
              required: [pubkeys]
      responses:
        '200':
          description: Found and missing profiles
        '400':
          $ref: '#/components/responses/Error'
  /api/v1/authors/{pubkey}/events:
    get:
      tags: [public]
      summary: Recent authored events
      parameters:
        - in: path
          name: pubkey
          required: true
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Event list
  /api/v1/authors/{pubkey}/replies:
    get:
      tags: [public]
      summary: Replies authored by pubkey
      parameters:
        - in: path
          name: pubkey
          required: true
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Reply list
  /api/v1/authors/{pubkey}/analytics/summary:
    get:
      tags: [public]
      summary: Windowed author analytics summary for account intelligence
      parameters:
        - in: path
          name: pubkey
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Author analytics windows with cadence, engagement, and media mix
  /api/v1/authors/{pubkey}/analytics/topics:
    get:
      tags: [public]
      summary: Top author hashtags for selected analytics window
      parameters:
        - in: path
          name: pubkey
          required: true
          schema: { type: string }
        - in: query
          name: window
          schema: { type: string, enum: [7d, 30d, 90d], default: 30d }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Author topic usage rows for the selected window
        '400':
          $ref: '#/components/responses/Error'
  /api/v1/authors/{pubkey}/analytics/media-mix:
    get:
      tags: [public]
      summary: Author media mix for selected analytics window
      parameters:
        - in: path
          name: pubkey
          required: true
          schema: { type: string }
        - in: query
          name: window
          schema: { type: string, enum: [7d, 30d, 90d], default: 30d }
      responses:
        '200':
          description: Author media mix counts for the selected window
        '400':
          $ref: '#/components/responses/Error'
  /api/v1/authors/{pubkey}/analytics/activity-windows:
    get:
      tags: [public]
      summary: Author audience activity windows by UTC hour/day over rolling windows
      parameters:
        - in: path
          name: pubkey
          required: true
          schema: { type: string }
        - in: query
          name: window
          schema: { type: string, enum: [7d, 30d, 90d], default: 30d }
      responses:
        '200':
          description: Engagement timing aggregates (UTC) by hour, day, and heatmap buckets
        '400':
          $ref: '#/components/responses/Error'
  /api/v1/authors/{pubkey}/analytics/posting-patterns:
    get:
      tags: [public]
      summary: Author posting cadence by UTC hour/day over rolling windows
      parameters:
        - in: path
          name: pubkey
          required: true
          schema: { type: string }
        - in: query
          name: window
          schema: { type: string, enum: [7d, 30d, 90d], default: 30d }
      responses:
        '200':
          description: Posting cadence aggregates (UTC) by hour, day, and heatmap buckets
        '400':
          $ref: '#/components/responses/Error'
  /api/v1/authors/{pubkey}/analytics/top-notes:
    get:
      tags: [public]
      summary: Top-performing authored notes by explicit weighted engagement
      parameters:
        - in: path
          name: pubkey
          required: true
          schema: { type: string }
        - in: query
          name: window
          schema: { type: string, enum: [7d, 30d, 90d], default: 30d }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
      responses:
        '200':
          description: Ranked top notes with weighted engagement scores, media segment, and primary topic
        '400':
          $ref: '#/components/responses/Error'
  /api/v1/authors/{pubkey}/analytics/performance-summary:
    get:
      tags: [public]
      summary: Recent author performance summary with averages, medians, totals, and prior-window comparison
      parameters:
        - in: path
          name: pubkey
          required: true
          schema: { type: string }
        - in: query
          name: window
          schema: { type: string, enum: [7d, 30d, 90d], default: 30d }
      responses:
        '200':
          description: Window-scoped performance summary with weighted engagement formula and comparison deltas
        '400':
          $ref: '#/components/responses/Error'
  /api/v1/authors/{pubkey}/analytics/recycle-candidates:
    get:
      tags: [public]
      summary: Bounded list of older authored notes suitable for repost/recycle workflows
      parameters:
        - in: path
          name: pubkey
          required: true
          schema: { type: string }
        - in: query
          name: window
          schema: { type: string, enum: [7d, 30d, 90d], default: 90d }
        - in: query
          name: min_age
          schema: { type: string, enum: [3d, 7d, 14d, 30d, 60d, 90d, 180d, 365d], default: 30d }
        - in: query
          name: min_performance_percentile
          schema: { type: number, minimum: 0, maximum: 100, default: 70 }
        - in: query
          name: include_replies
          schema: { type: boolean, default: false }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200':
          description: Ranked recycle candidates filtered by age, percentile, and recent repost markers
        '400':
          $ref: '#/components/responses/Error'
  /api/v1/relays/health:
    get:
      tags: [public]
      summary: Aggregate persisted relay ingest health
      responses:
        '200':
          description: Relay health rows from checkpoint state
  /api/v1/contact-lists/{pubkey}:
    get:
      tags: [public]
      summary: Latest projected contact list
      parameters:
        - in: path
          name: pubkey
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Contact list projection
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/relay-lists/{pubkey}:
    get:
      tags: [public]
      summary: Latest projected relay list
      parameters:
        - in: path
          name: pubkey
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Relay list projection
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/search:
    get:
      tags: [public]
      summary: Combined event/profile full-text search
      parameters:
        - in: query
          name: q
          required: true
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Search results with trust metadata (`trust_mode`, `trust_applied`, `result_scope`)
        '400':
          $ref: '#/components/responses/Error'
  /api/v1/search/notes:
    get:
      tags: [public]
      summary: Notes-only full-text search with minimal product filters
      parameters:
        - in: query
          name: q
          required: true
          schema: { type: string }
        - in: query
          name: sort
          schema: { type: string, enum: [relevant, latest], default: relevant }
        - in: query
          name: window
          schema: { type: string, enum: [24h, 7d] }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, maximum: 5000, default: 0 }
      responses:
        '200':
          description: Notes search results with trust metadata (`trust_mode`, `trust_applied`, `result_scope`)
        '400':
          $ref: '#/components/responses/Error'
  /api/v1/search/profiles:
    get:
      tags: [public]
      summary: Profiles-only full-text search with minimal product filters
      parameters:
        - in: query
          name: q
          required: true
          schema: { type: string }
        - in: query
          name: sort
          schema: { type: string, enum: [relevant], default: relevant }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, maximum: 5000, default: 0 }
      responses:
        '200':
          description: Profiles search results with trust metadata (`trust_mode`, `trust_applied`, `result_scope`)
        '400':
          $ref: '#/components/responses/Error'
  /api/v1/search/suggest:
    get:
      tags: [public]
      summary: Lightweight grouped suggestions for profiles and hashtags
      parameters:
        - in: query
          name: q
          required: true
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 20, default: 8 }
      responses:
        '200':
          description: Grouped search suggestions
        '400':
          $ref: '#/components/responses/Error'
  /api/v1/discovery/notes/trending:
    get:
      tags: [public]
      summary: Trending notes from projection-backed discovery stats
      parameters:
        - in: query
          name: window
          schema: { type: string, enum: [24h, 7d], default: 24h }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, maximum: 5000, default: 0 }
      responses:
        '200':
          description: Ranked trending notes with trust metadata (`trust_mode`, `trust_applied`, `result_scope`)
        '400':
          $ref: '#/components/responses/Error'
  /api/v1/discovery/conversations/hot:
    get:
      tags: [public]
      summary: Hot conversations from projection-backed thread activity windows
      parameters:
        - in: query
          name: window
          schema: { type: string, enum: [24h, 7d], default: 24h }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, maximum: 5000, default: 0 }
      responses:
        '200':
          description: Active conversation hotspots ranked by velocity score and recency
        '400':
          $ref: '#/components/responses/Error'
  /api/v1/discovery/home:
    get:
      tags: [public]
      summary: Product-shaped homepage discovery bundle for nostrmash.com
      parameters:
        - in: query
          name: window
          schema: { type: string, enum: [24h, 7d], default: 24h }
        - in: query
          name: notes_limit
          schema: { type: integer, minimum: 1, maximum: 20, default: 10 }
        - in: query
          name: hashtags_limit
          schema: { type: integer, minimum: 1, maximum: 20, default: 10 }
        - in: query
          name: profiles_limit
          schema: { type: integer, minimum: 1, maximum: 20, default: 10 }
        - in: query
          name: hashtag_stat_limit
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
      responses:
        '200':
          description: Homepage discovery bundle with bounded notes, hashtags, profiles, and network summary sections
        '400':
          $ref: '#/components/responses/Error'
        '501':
          $ref: '#/components/responses/Error'
  /api/v1/discovery/profiles/trending:
    get:
      tags: [public]
      summary: Trending profiles from projection-backed discovery stats
      parameters:
        - in: query
          name: window
          schema: { type: string, enum: [24h, 7d], default: 24h }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, maximum: 5000, default: 0 }
      responses:
        '200':
          description: Ranked trending profiles with trust metadata (`trust_mode`, `trust_applied`, `result_scope`)
        '400':
          $ref: '#/components/responses/Error'
  /api/v1/discovery/profiles/rising:
    get:
      tags: [public]
      summary: Rising profiles from projection-backed discovery stats
      parameters:
        - in: query
          name: window
          schema: { type: string, enum: [24h, 7d], default: 24h }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, maximum: 5000, default: 0 }
      responses:
        '200':
          description: Ranked rising profiles with trust metadata (`trust_mode`, `trust_applied`, `result_scope`)
        '400':
          $ref: '#/components/responses/Error'
  /api/v1/discovery/hashtags/trending:
    get:
      tags: [public]
      summary: Trending hashtags over rolling windows
      parameters:
        - in: query
          name: window
          schema: { type: string, enum: [24h, 7d], default: 24h }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, maximum: 5000, default: 0 }
      responses:
        '200':
          description: Ranked trending hashtags with trust metadata (`trust_mode`, `trust_applied`, `result_scope`)
        '400':
          $ref: '#/components/responses/Error'
  /api/v1/discovery/hashtags/{hashtag}:
    get:
      tags: [public]
      summary: Hashtag page summary with bounded activity stats
      parameters:
        - in: path
          name: hashtag
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Hashtag summary and recent activity windows with trust metadata (`trust_mode`, `trust_applied`, `result_scope`)
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/discovery/hashtags/{hashtag}/notes:
    get:
      tags: [public]
      summary: Hashtag notes feed (latest or top) over bounded windows
      parameters:
        - in: path
          name: hashtag
          required: true
          schema: { type: string }
        - in: query
          name: sort
          schema: { type: string, enum: [latest, top], default: latest }
        - in: query
          name: window
          schema: { type: string, enum: [24h, 7d, 30d, all], default: 24h }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, maximum: 5000, default: 0 }
      responses:
        '200':
          description: Hashtag notes list with trust metadata (`trust_mode`, `trust_applied`, `result_scope`)
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/discovery/hashtags/{hashtag}/related:
    get:
      tags: [public]
      summary: Bounded related hashtags for one hashtag
      parameters:
        - in: path
          name: hashtag
          required: true
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
      responses:
        '200':
          description: Related hashtags with co-occurrence counts and trust metadata (`trust_mode`, `trust_applied`, `result_scope`)
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/discovery/domains/trending:
    get:
      tags: [public]
      summary: Trending linked domains over rolling windows
      parameters:
        - in: query
          name: window
          schema: { type: string, enum: [24h, 7d], default: 24h }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, maximum: 5000, default: 0 }
      responses:
        '200':
          description: Ranked trending domains with bounded trend windows and trust metadata (`trust_mode`, `trust_applied`, `result_scope`)
        '400':
          $ref: '#/components/responses/Error'
  /api/v1/discovery/domains/{domain}:
    get:
      tags: [public]
      summary: Domain summary page with trend windows and recent/top notes
      parameters:
        - in: path
          name: domain
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Domain summary with link/note/author counts and recent/top note lists
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/discovery/domains/{domain}/notes:
    get:
      tags: [public]
      summary: Domain-linked notes feed (latest or top) over bounded windows
      parameters:
        - in: path
          name: domain
          required: true
          schema: { type: string }
        - in: query
          name: sort
