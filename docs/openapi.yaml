                              mode: { type: string }
                              filter_group: { type: string }
                              state: { type: string }
                              status: { type: string }
                              since: { type: integer, nullable: true }
                              until: { type: integer, nullable: true }
                              cursor: { type: string, nullable: true }
                              last_connected_at: { type: string, format: date-time, nullable: true }
                              last_disconnected_at: { type: string, format: date-time, nullable: true }
                              last_progress_at: { type: string, format: date-time, nullable: true }
                              last_error: { type: string, nullable: true }
                              last_error_at: { type: string, format: date-time, nullable: true }
                              eose_seen_at: { type: string, format: date-time, nullable: true }
                              updated_at: { type: string, format: date-time }
