components:
  securitySchemes:
    BearerToken:
      type: http
      scheme: bearer
      bearerFormat: OpaqueToken
  responses:
    Error:
      description: Structured API error
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  code: { type: string }
                  message: { type: string }
                  request_id: { type: string }
                required: [code, message, request_id]
            required: [error]
