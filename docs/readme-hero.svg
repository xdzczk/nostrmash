<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">NostrMash hero banner</title>
  <desc id="desc">Branded hero banner for the NostrMash README highlighting self-hosting, durable truth, and Primal-compatible adoption.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="55%" stop-color="#eef6ff"/>
      <stop offset="100%" stop-color="#f4fffb"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="accentSoft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#ccfbf1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <style>
      .panel { fill: url(#bg); stroke: #d9e7f4; stroke-width: 1.5; filter: url(#shadow); }
      .card { fill: #ffffff; stroke: #dbe7f5; stroke-width: 1.5; filter: url(#shadow); }
      .chip { fill: #ffffff; stroke: #cfe0f2; stroke-width: 1.2; }
      .chipText { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .eyebrow { font: 700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0.12em; text-transform: uppercase; fill: #475569; }
      .title { font: 800 64px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 500 25px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .body { font: 500 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .label { font: 700 20px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .small { font: 600 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; letter-spacing: 0.06em; text-transform: uppercase; }
      .mono { font: 700 17px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #0f172a; }
      .line { stroke: url(#accent); stroke-width: 5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .softLine { stroke: #94a3b8; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 8 8; }
      .accentFill { fill: url(#accent); }
      .accentSoftFill { fill: url(#accentSoft); }
      .white { fill: #ffffff; }
    </style>
    <marker id="arrowhead" markerWidth="12" markerHeight="12" refX="9" refY="4.5" orient="auto">
      <polygon points="0 0, 9 4.5, 0 9" fill="#2563eb"/>
    </marker>
  </defs>

  <rect x="24" y="24" width="1232" height="592" rx="34" class="panel"/>

  <circle cx="1120" cy="114" r="110" fill="#dbeafe" opacity="0.55"/>
  <circle cx="1190" cy="206" r="66" fill="#ccfbf1" opacity="0.65"/>
  <circle cx="88" cy="540" r="84" fill="#e0f2fe" opacity="0.6"/>

  <g transform="translate(84 88)">
    <text x="0" y="0" class="eyebrow">Flagship open-source Nostr backend</text>
    <text x="0" y="86" class="title">NostrMash</text>
    <text x="0" y="130" class="subtitle">Own the data plane. Keep the client boundary compatible.</text>
    <text x="0" y="182" class="body">Durable canonical ingest in Postgres, rebuildable product views, and a Primal-compatible edge for practical migration.</text>

    <rect x="0" y="234" width="216" height="48" rx="24" class="chip"/>
    <text x="28" y="265" class="chipText">Self-hostable</text>

    <rect x="230" y="234" width="232" height="48" rx="24" class="chip"/>
    <text x="258" y="265" class="chipText">Durable truth first</text>

    <rect x="476" y="234" width="278" height="48" rx="24" class="chip"/>
    <text x="504" y="265" class="chipText">Primal-compatible edge</text>
  </g>

  <g transform="translate(720 132)">
    <rect x="0" y="0" width="456" height="356" rx="28" class="card"/>
    <text x="32" y="40" class="small">System posture</text>

    <rect x="32" y="82" width="112" height="74" rx="18" class="accentSoftFill" opacity="0.9"/>
    <text x="56" y="116" class="label">Relays</text>
    <text x="56" y="138" class="body">live inputs</text>

    <rect x="178" y="82" width="124" height="74" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.4"/>
    <text x="204" y="116" class="label">Ingestor</text>
    <text x="204" y="138" class="body">validate + write</text>

    <rect x="336" y="70" width="88" height="98" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.4"/>
    <text x="355" y="110" class="label">Core</text>
    <text x="353" y="132" class="mono">PG</text>
    <text x="351" y="151" class="body">events</text>

    <path d="M144 119 H178" class="line" marker-end="url(#arrowhead)"/>
    <path d="M302 119 H336" class="line" marker-end="url(#arrowhead)"/>

    <rect x="178" y="216" width="124" height="74" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
    <text x="220" y="250" class="label">Worker</text>
    <text x="202" y="272" class="body">rebuildable views</text>

    <rect x="336" y="216" width="88" height="74" rx="18" fill="#ecfeff" stroke="#67e8f9" stroke-width="1.4"/>
    <text x="360" y="250" class="label">API</text>
    <text x="350" y="272" class="body">native</text>

    <rect x="32" y="216" width="112" height="74" rx="18" fill="#f0fdf4" stroke="#86efac" stroke-width="1.4"/>
    <text x="51" y="250" class="label">Trust + Redis</text>
    <text x="57" y="272" class="body">working state</text>

    <path d="M380 168 V216" class="softLine"/>
    <path d="M302 253 H336" class="line" marker-end="url(#arrowhead)"/>
    <path d="M88 216 V170 H336" class="softLine"/>

    <rect x="276" y="308" width="148" height="28" rx="14" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.2"/>
    <text x="291" y="327" class="small">Primal-compatible boundary</text>
  </g>

  <g transform="translate(86 426)">
    <rect x="0" y="0" width="584" height="114" rx="24" class="card"/>
    <text x="28" y="36" class="small">Why teams pick it</text>
    <text x="28" y="68" class="label">Docker-first self-hosting, visible operations, and an easier path off cache-shaped infrastructure.</text>
    <text x="28" y="92" class="body">Built to replace fragile glue stacks with a backend you can run, inspect, and evolve.</text>
  </g>
</svg>
