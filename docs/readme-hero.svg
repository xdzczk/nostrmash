<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">NostrMash hero banner</title>
  <desc id="heroDesc">Premium README hero banner for NostrMash highlighting self-hostable deployment, durable canonical Postgres truth, rebuildable product views, and a compatible API edge.</desc>
  <defs>
    <linearGradient id="heroPanelBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f9fbff"/>
      <stop offset="56%" stop-color="#edf5ff"/>
      <stop offset="100%" stop-color="#f4fcfb"/>
    </linearGradient>
    <linearGradient id="heroCardBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fbff"/>
    </linearGradient>
    <linearGradient id="heroCoreFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef4ff"/>
      <stop offset="100%" stop-color="#dce9ff"/>
    </linearGradient>
    <linearGradient id="heroRelayFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f3fbff"/>
      <stop offset="100%" stop-color="#dff7f3"/>
    </linearGradient>
    <linearGradient id="heroApiFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7f5ff"/>
      <stop offset="100%" stop-color="#ece9ff"/>
    </linearGradient>
    <filter id="heroShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <filter id="heroSoftShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.05"/>
    </filter>
    <style>
      .panel { fill: url(#heroPanelBg); stroke: #d8e5f3; stroke-width: 1.5; filter: url(#heroShadow); }
      .supportCard { fill: url(#heroCardBg); fill-opacity: 0.86; stroke: #e5edf6; stroke-width: 1.05; filter: url(#heroSoftShadow); }
      .chip { fill: #ffffff; stroke: #d3e1f0; stroke-width: 1.15; }
      .nodeBase { fill: #ffffff; fill-opacity: 0.94; stroke: #dde5ef; stroke-width: 1.1; }
      .nodeRelay { fill: url(#heroRelayFill); fill-opacity: 0.82; stroke: #c6ece7; stroke-width: 1.1; }
      .nodeCore { fill: url(#heroCoreFill); stroke: #8fb7ff; stroke-width: 1.5; }
      .nodeApi { fill: url(#heroApiFill); fill-opacity: 0.82; stroke: #dacdfd; stroke-width: 1.1; }
      .eyebrow { font: 700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0.14em; text-transform: uppercase; fill: #536375; }
      .title { font: 800 78px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 680 26px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172554; }
      .body { font: 500 19px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .chipText { font: 700 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .sectionLabel { font: 700 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0.12em; text-transform: uppercase; fill: #64748b; }
      .cardHeadline { font: 660 22px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #263548; }
      .cardBody { font: 500 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #5c6b7e; }
      .supportLabel { font: 700 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0.1em; text-transform: uppercase; fill: #64748b; }
      .supportBody { font: 550 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .nodeText { font: 680 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #243447; }
      .coreText { font: 740 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #162338; }
      .flow { stroke: #7b93c8; stroke-width: 2.6; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <marker id="heroArrowHead" markerWidth="8" markerHeight="8" refX="6.1" refY="3" orient="auto">
      <polygon points="0 0, 6.1 3, 0 6" fill="#7b93c8"/>
    </marker>
  </defs>

  <rect x="24" y="24" width="1232" height="592" rx="34" class="panel"/>

  <circle cx="1070" cy="152" r="92" fill="#dfeafe" opacity="0.22"/>
  <circle cx="1148" cy="222" r="58" fill="#d9f7ef" opacity="0.20"/>
  <circle cx="118" cy="538" r="68" fill="#e8f3ff" opacity="0.15"/>

  <g transform="translate(84 96)">
    <text x="0" y="0" class="eyebrow">Flagship open-source Nostr backend</text>
    <text x="0" y="94" class="title">NostrMash</text>
    <text x="0" y="158" class="subtitle">
      <tspan x="0" dy="0">Own the data plane.</tspan>
      <tspan x="0" dy="32">Keep the client boundary compatible.</tspan>
    </text>
    <text x="0" y="252" class="body">
      <tspan x="0" dy="0">Durable canonical ingest in Postgres, rebuildable views,</tspan>
      <tspan x="0" dy="32">with a practical edge for drop-in adoption.</tspan>
    </text>

    <rect x="0" y="314" width="182" height="44" rx="22" class="chip"/>
    <text x="24" y="342" class="chipText">Self-hostable</text>

    <rect x="196" y="314" width="208" height="44" rx="22" class="chip"/>
    <text x="222" y="342" class="chipText">Durable truth first</text>

    <text x="0" y="420" class="supportLabel">Calm operations</text>
    <text x="0" y="454" class="supportBody">Docker-first boot. Rebuild views</text>
    <text x="0" y="482" class="supportBody">without touching durable truth.</text>
  </g>

  <g transform="translate(756 100)">
    <rect x="0" y="0" width="400" height="412" rx="30" class="supportCard"/>
    <text x="34" y="44" class="sectionLabel">System posture</text>
    <text x="34" y="80" class="cardHeadline">Durable core, rebuildable edge.</text>
    <text x="34" y="108" class="cardBody">From relay ingest to compatible reads.</text>

    <rect x="58" y="144" width="284" height="50" rx="20" class="nodeRelay"/>
    <text x="200" y="175" text-anchor="middle" class="nodeText">Relays</text>

    <rect x="34" y="210" width="332" height="62" rx="22" class="nodeCore"/>
    <text x="200" y="248" text-anchor="middle" class="coreText">Canonical Core</text>

    <rect x="58" y="292" width="284" height="50" rx="20" class="nodeBase"/>
    <text x="200" y="323" text-anchor="middle" class="nodeText">Rebuildable Views</text>

    <rect x="74" y="358" width="252" height="46" rx="19" class="nodeApi"/>
    <text x="200" y="387" text-anchor="middle" class="nodeText">Compatible API</text>

    <path d="M200 194 V204" class="flow" marker-end="url(#heroArrowHead)"/>
    <path d="M200 272 V284" class="flow" marker-end="url(#heroArrowHead)"/>
    <path d="M200 342 V352" class="flow" marker-end="url(#heroArrowHead)"/>
  </g>
</svg>
