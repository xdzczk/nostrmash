<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="logoTitle logoDesc">
  <title id="logoTitle">NostrMash logo mark</title>
  <desc id="logoDesc">Twin dark discs with a sharp folded center and transparent background.</desc>
  <defs>
    <clipPath id="markClip">
      <circle cx="362" cy="514" r="252"/>
      <circle cx="662" cy="514" r="252"/>
    </clipPath>

    <radialGradient id="leftBody" cx="38%" cy="33%" r="78%">
      <stop offset="0%" stop-color="#5f6871"/>
      <stop offset="40%" stop-color="#4d565f"/>
      <stop offset="73%" stop-color="#323a42"/>
      <stop offset="100%" stop-color="#1b2128"/>
    </radialGradient>
    <radialGradient id="rightBody" cx="58%" cy="33%" r="78%">
      <stop offset="0%" stop-color="#626b73"/>
      <stop offset="43%" stop-color="#505961"/>
      <stop offset="76%" stop-color="#353d45"/>
      <stop offset="100%" stop-color="#1c2229"/>
    </radialGradient>

    <linearGradient id="foldLeft" x1="24%" y1="26%" x2="78%" y2="84%">
      <stop offset="0%" stop-color="#4f5862"/>
      <stop offset="45%" stop-color="#2e353d"/>
      <stop offset="100%" stop-color="#161c22"/>
    </linearGradient>
    <linearGradient id="foldRight" x1="12%" y1="20%" x2="84%" y2="88%">
      <stop offset="0%" stop-color="#5b646d"/>
      <stop offset="38%" stop-color="#3f4851"/>
      <stop offset="100%" stop-color="#222930"/>
    </linearGradient>

    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="grain" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="13" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.05"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <g clip-path="url(#markClip)">
    <circle cx="362" cy="514" r="252" fill="url(#leftBody)"/>
    <circle cx="662" cy="514" r="252" fill="url(#rightBody)"/>

    <ellipse cx="300" cy="390" rx="210" ry="154" fill="#7a838c" opacity="0.12"/>
    <ellipse cx="722" cy="392" rx="208" ry="154" fill="#7f8891" opacity="0.12"/>
    <ellipse cx="358" cy="670" rx="245" ry="180" fill="#0b0f14" opacity="0.28"/>
    <ellipse cx="664" cy="668" rx="245" ry="180" fill="#0b0f14" opacity="0.26"/>

    <path d="M548 258 L590 336 L564 372 L518 300 Z" fill="#1b2026" opacity="0.95"/>
    <path d="M541 256 L548 258 L518 300 L512 294 Z" fill="#67717a" opacity="0.24"/>

    <path d="M540 248 C602 332 598 456 580 620 C571 699 573 746 585 778" fill="none" stroke="#0f1419" stroke-width="34" stroke-linecap="round" opacity="0.68" filter="url(#softBlur)"/>
    <path d="M546 262 C590 338 588 454 574 610 C566 688 568 731 578 761" fill="none" stroke="#272f37" stroke-width="14" stroke-linecap="round" opacity="0.42"/>

    <path d="M354 453 L551 553 L470 772 Z" fill="url(#foldLeft)"/>
    <path d="M551 553 L702 631 L616 548 Z" fill="url(#foldRight)"/>
    <path d="M354 453 L551 553 L616 548" fill="none" stroke="#8b959e" stroke-opacity="0.24" stroke-width="2"/>
    <path d="M350 454 L458 756 L472 772 L364 488 Z" fill="#0e1318" opacity="0.38"/>
    <path d="M551 553 L697 630 L655 632 L586 590 Z" fill="#0d1217" opacity="0.44"/>

    <path d="M198 296 C272 255 380 238 474 266" fill="none" stroke="#919aa3" stroke-opacity="0.15" stroke-width="3"/>
    <path d="M548 266 C644 235 752 253 826 300" fill="none" stroke="#9aa3ac" stroke-opacity="0.15" stroke-width="3"/>

    <rect x="100" y="238" width="824" height="560" fill="#ffffff" opacity="0.26" filter="url(#grain)"/>
  </g>
</svg>
