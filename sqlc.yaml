version: "2"
sql:
  # Pilot: the account-state bounded context. Only single-table
  # account_states / account_state_transitions statements are generated; the
  # cross-context signals join stays hand-written in internal/store/account.
  - engine: "postgresql"
    schema: "migrations/000052_account_states.sql"
    queries: "internal/store/account/queries"
    gen:
      go:
        package: "accountdb"
        out: "internal/store/account/accountdb"
        sql_package: "pgx/v5"
        emit_interface: true
        emit_exact_table_names: false
        emit_empty_slices: true
        overrides:
          - db_type: "pg_catalog.timestamptz"
            nullable: true
            go_type:
              import: "time"
              type: "Time"
              pointer: true
          - db_type: "text"
            nullable: true
            go_type:
              type: "string"
              pointer: true
          - db_type: "pg_catalog.int4"
            nullable: true
            go_type:
              type: "int32"
              pointer: true

  # Second context (verdict Jul 2026): retention's static CTE DELETE/UPDATE
  # sweeps. Every statement is a plain :execrows returning RowsAffected, so the
  # generated layer is pure plumbing and the hand-written wrappers in
  # internal/store/retention keep the validation, metrics, and transaction
  # shape. Retention touches many tables, so its schema entry point is the full
  # migrations/ directory (sqlc applies them in lexical order). Timestamptz
  # params stay as pgtype.Timestamptz (sqlc treats bind params as nullable);
  # the thin wrappers convert domain time.Time via a small local helper.
  - engine: "postgresql"
    schema: "migrations"
    queries: "internal/store/retention/queries"
    gen:
      go:
        package: "retentiondb"
        out: "internal/store/retention/retentiondb"
        sql_package: "pgx/v5"
        emit_interface: true
        emit_exact_table_names: false
        emit_empty_slices: true
