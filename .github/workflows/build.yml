name: build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-artifacts-foundation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build release archives and checksums
        run: bash scripts/release/build-artifacts.sh

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: ./dist
          format: spdx-json
          output-file: dist/nostrmash.spdx.json

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build container image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          tags: nostrmash:ci-${{ github.sha }}

      - name: Generate changelog preview
        run: bash scripts/release/generate-changelog.sh "build-${{ github.run_number }}" dist/changelog-preview.md

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-foundation-${{ github.run_number }}
          path: dist/
          retention-days: 30
