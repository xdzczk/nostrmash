name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write
  packages: write

jobs:
  publish-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
          cache: true

      - name: Resolve container image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build release archives and checksums
        run: bash scripts/release/build-artifacts.sh

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: ./dist
          format: spdx-json
          output-file: dist/nostrmash.spdx.json

      - name: Verify dist hygiene
        run: |
          ! ls dist/coverage*.out dist/*.prof dist/*.pprof dist/*.trace dist/*.log >/dev/null 2>&1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push container image
        id: image-build
        uses: docker/build-push-action@v7
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Record image digest
        run: |
          {
            echo "image=${{ steps.image.outputs.name }}"
            echo "digest=${{ steps.image-build.outputs.digest || 'not-published' }}"
          } > dist/image-digest.txt

      - name: Generate release changelog
        run: bash scripts/release/generate-changelog.sh "${{ github.ref_name }}" dist/changelog.md

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign release metadata (keyless)
        run: |
          cosign sign-blob --yes --output-signature dist/sha256sums.txt.sig --output-certificate dist/sha256sums.txt.pem dist/sha256sums.txt
          cosign sign-blob --yes --output-signature dist/nostrmash.spdx.json.sig --output-certificate dist/nostrmash.spdx.json.pem dist/nostrmash.spdx.json

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/sha256sums.txt
            dist/nostrmash.spdx.json
            dist/image-digest.txt
            dist/changelog.md

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-security-${{ github.ref_name }}
          path: |
            dist/*.tar.gz
            dist/sha256sums.txt
            dist/sha256sums.txt.sig
            dist/sha256sums.txt.pem
            dist/nostrmash.spdx.json
            dist/nostrmash.spdx.json.sig
            dist/nostrmash.spdx.json.pem
            dist/image-digest.txt
            dist/changelog.md
          retention-days: 90

      - name: Publish GitHub release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body_path: dist/changelog.md
          files: |
            dist/*.tar.gz
            dist/sha256sums.txt
            dist/sha256sums.txt.sig
            dist/sha256sums.txt.pem
            dist/nostrmash.spdx.json
            dist/nostrmash.spdx.json.sig
            dist/nostrmash.spdx.json.pem
            dist/image-digest.txt
            dist/changelog.md
