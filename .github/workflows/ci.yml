name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: nostrmash
          POSTGRES_PASSWORD: nostrmash
          POSTGRES_DB: nostrmash
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nostrmash -d nostrmash"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      meilisearch:
        image: getmeili/meilisearch:v1.10
        env:
          MEILI_MASTER_KEY: nostrmash-ci
          MEILI_NO_ANALYTICS: "true"
        ports:
          - 7700:7700

    env:
      TEST_DATABASE_URL: postgres://nostrmash:nostrmash@localhost:5432/nostrmash?sslmode=disable
      TEST_REDIS_URL: redis://localhost:6379/0
      TEST_MEILI_URL: http://localhost:7700
      TEST_MEILI_MASTER_KEY: nostrmash-ci

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
          cache: true

      - name: Wait for Postgres
        run: |
          for i in {1..30}; do
            pg_isready -h localhost -p 5432 -U nostrmash -d nostrmash && exit 0
            sleep 1
          done
          echo "Postgres did not become healthy in time"
          exit 1

      - name: Wait for Meilisearch
        run: |
          for i in {1..30}; do
            curl -sf http://localhost:7700/health && exit 0
            sleep 1
          done
          echo "Meilisearch did not become healthy in time"
          exit 1

      - name: Verify gofmt and import ordering
        run: make fmt-check imports-check

      - name: Run golangci-lint
        run: make lint

      - name: Verify module dependencies
        run: go mod verify

      - name: Run vulnerability check
        run: make vulncheck

      - name: Run tests with coverage profile
        run: |
          mkdir -p .tmp/ci
          COVERAGE_PROFILE=.tmp/ci/coverage.out make cover

      - name: Summarize coverage
        run: go tool cover -func=.tmp/ci/coverage.out | tee .tmp/ci/coverage-summary.txt

      - name: Enforce risk-focused coverage policy
        run: COVERAGE_PROFILE=.tmp/ci/coverage.out make coverage-policy

      - name: Run full race suite
        run: make test-race-policy

      - name: Verify route contract drift
        run: make contract-drift

      - name: Validate Prometheus rules
        run: make rules-check

      - name: Verify configuration docs are up to date
        run: make configdoc-check

      - name: Verify sqlc generated code is up to date
        run: make sqlc-check

      - name: Build binaries
        run: make build

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            .tmp/ci/coverage.out
            .tmp/ci/coverage-summary.txt
          retention-days: 30
