name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nostrmash
          POSTGRES_PASSWORD: nostrmash
          POSTGRES_DB: nostrmash
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nostrmash -d nostrmash"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://nostrmash:nostrmash@localhost:5432/nostrmash?sslmode=disable

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Wait for Postgres
        run: |
          for i in {1..30}; do
            pg_isready -h localhost -p 5432 -U nostrmash -d nostrmash && exit 0
            sleep 1
          done
          echo "Postgres did not become healthy in time"
          exit 1

      - name: Verify gofmt and import ordering
        run: make fmt-check imports-check

      - name: Run golangci-lint
        run: make lint

      - name: Verify module dependencies
        run: go mod verify

      - name: Run vulnerability check
        run: make vulncheck

      - name: Run tests with coverage profile
        run: go test -covermode=atomic -coverprofile=coverage.out ./...

      - name: Summarize coverage
        run: go tool cover -func=coverage.out | tee coverage-summary.txt

      - name: Enforce risk-focused coverage policy
        run: make coverage-policy

      - name: Run race policy suite
        run: make test-race-policy

      - name: Verify route contract drift
        run: make contract-drift

      - name: Validate Prometheus rules
        run: make rules-check

      - name: Verify configuration docs are up to date
        run: make configdoc-check

      - name: Build binaries
        run: make build

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            coverage.out
            coverage-summary.txt
          retention-days: 30
