name: nostrmash

x-nostrmash-service: &nostrmash-service
  build:
    context: .
    dockerfile: Dockerfile
  image: nostrmash:coolify
  restart: unless-stopped
  init: true

x-common-env: &common-env
  DATABASE_URL: ${DATABASE_URL}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  ENVIRONMENT: ${ENVIRONMENT:-production}
  APP_VERSION: ${APP_VERSION:-coolify}

services:
  api:
    <<: *nostrmash-service
    command: ["/app/api"]
    expose:
      - "8080"
    environment:
      <<: *common-env
      HTTP_ADDR: ":8080"
      ADMIN_BEARER_TOKEN: ${ADMIN_BEARER_TOKEN}
      API_MAX_BATCH_SIZE: ${API_MAX_BATCH_SIZE:-200}
      HTTP_RATE_LIMIT_RPM: ${HTTP_RATE_LIMIT_RPM:-240}
      HTTP_RATE_LIMIT_BURST: ${HTTP_RATE_LIMIT_BURST:-60}
      HTTP_SEARCH_RATE_LIMIT_RPM: ${HTTP_SEARCH_RATE_LIMIT_RPM:-60}
      HTTP_BATCH_RATE_LIMIT_RPM: ${HTTP_BATCH_RATE_LIMIT_RPM:-40}
      HTTP_DM_COMPAT_RATE_LIMIT_RPM: ${HTTP_DM_COMPAT_RATE_LIMIT_RPM:-30}
      INGESTOR_RELAY_URLS: ${INGESTOR_RELAY_URLS}
      INGESTOR_RELAY_DISABLED: ${INGESTOR_RELAY_DISABLED:-}
      PRIMAL_WS_ALLOWED_ORIGINS: ${PRIMAL_WS_ALLOWED_ORIGINS:-}
      PRIMAL_WS_ALLOW_ANY_ORIGIN: ${PRIMAL_WS_ALLOW_ANY_ORIGIN:-false}
      PRIMAL_WS_MAX_MESSAGE_BYTES: ${PRIMAL_WS_MAX_MESSAGE_BYTES:-1048576}
      PRIMAL_WS_MAX_REQ_PER_MINUTE: ${PRIMAL_WS_MAX_REQ_PER_MINUTE:-240}
      PRIMAL_WS_MAX_SUBSCRIPTIONS: ${PRIMAL_WS_MAX_SUBSCRIPTIONS:-200}
      PRIMAL_WS_REQUEST_TIMEOUT: ${PRIMAL_WS_REQUEST_TIMEOUT:-10s}

  ingestor:
    <<: *nostrmash-service
    command: ["/app/ingestor"]
    environment:
      <<: *common-env
      METRICS_ADDR: ${INGESTOR_METRICS_ADDR:-:9090}
      INGESTOR_MODE: ${INGESTOR_MODE:-live}
      INGESTOR_FILTER_GROUP: ${INGESTOR_FILTER_GROUP:-default_v1}
      INGESTOR_FILTER_GROUPS_JSON: ${INGESTOR_FILTER_GROUPS_JSON:-}
      INGESTOR_RELAY_URLS: ${INGESTOR_RELAY_URLS}
      INGESTOR_RELAY_ALLOWLIST: ${INGESTOR_RELAY_ALLOWLIST}
      INGESTOR_RELAY_DISABLED: ${INGESTOR_RELAY_DISABLED:-}
      INGESTOR_RELAY_REQUIRE_TLS: ${INGESTOR_RELAY_REQUIRE_TLS:-true}
      INGESTOR_RELAY_CONNECT_TIMEOUT: ${INGESTOR_RELAY_CONNECT_TIMEOUT:-10s}
      INGESTOR_RELAY_BACKOFF_INITIAL: ${INGESTOR_RELAY_BACKOFF_INITIAL:-1s}
      INGESTOR_RELAY_BACKOFF_MAX: ${INGESTOR_RELAY_BACKOFF_MAX:-30s}
      INGESTOR_RELAY_LAG_THRESHOLD: ${INGESTOR_RELAY_LAG_THRESHOLD:-45s}
      INGESTOR_LIVE_BOOTSTRAP_LOOKBACK_SECONDS: ${INGESTOR_LIVE_BOOTSTRAP_LOOKBACK_SECONDS:-300}
      INGESTOR_LIVE_RESUME_OVERLAP_SECONDS: ${INGESTOR_LIVE_RESUME_OVERLAP_SECONDS:-60}
      INGESTOR_BACKFILL_ENABLED: ${INGESTOR_BACKFILL_ENABLED:-false}
      INGESTOR_BACKFILL_MODE: ${INGESTOR_BACKFILL_MODE:-backfill}
      INGESTOR_BACKFILL_SINCE: ${INGESTOR_BACKFILL_SINCE:-}
      INGESTOR_BACKFILL_UNTIL: ${INGESTOR_BACKFILL_UNTIL:-}
      INGESTOR_BACKFILL_PAGE_LIMIT: ${INGESTOR_BACKFILL_PAGE_LIMIT:-500}
      INGESTOR_BACKFILL_CONNECT_TIMEOUT: ${INGESTOR_BACKFILL_CONNECT_TIMEOUT:-10s}
      INGESTOR_BACKFILL_IDLE_TIMEOUT: ${INGESTOR_BACKFILL_IDLE_TIMEOUT:-3s}
      INGESTOR_BACKFILL_EMPTY_PAGE_MAX: ${INGESTOR_BACKFILL_EMPTY_PAGE_MAX:-2}
      INGESTOR_REPLAY_FIXTURE_PATH: ${INGESTOR_REPLAY_FIXTURE_PATH:-}

  worker:
    <<: *nostrmash-service
    command: ["/app/worker"]
    environment:
      <<: *common-env
      METRICS_ADDR: ${WORKER_METRICS_ADDR:-:9090}
      DEBUG_ADDR: ${WORKER_DEBUG_ADDR:-}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}

  trust_worker:
    <<: *nostrmash-service
    command: ["/app/trust_worker"]
    environment:
      <<: *common-env
      METRICS_ADDR: ${TRUST_WORKER_METRICS_ADDR:-:9090}
      DEBUG_ADDR: ${TRUST_WORKER_DEBUG_ADDR:-}
      TRUST_REDIS_URL: ${TRUST_REDIS_URL}
      TRUST_WORKER_CONCURRENCY: ${TRUST_WORKER_CONCURRENCY:-2}
      TRUST_WORKER_CLAIM_BATCH_SIZE: ${TRUST_WORKER_CLAIM_BATCH_SIZE:-5}
      TRUST_WORKER_POLL_INTERVAL: ${TRUST_WORKER_POLL_INTERVAL:-1s}
      TRUST_WORKER_RETRY_DELAY: ${TRUST_WORKER_RETRY_DELAY:-5s}
      TRUST_ENABLE_SCORE_COMPUTE: ${TRUST_ENABLE_SCORE_COMPUTE:-true}
      TRUST_ENABLE_REDIS_SYNC: ${TRUST_ENABLE_REDIS_SYNC:-false}
