name: nostrmash

x-nostrmash-service: &nostrmash-service
  build:
    context: .
    dockerfile: Dockerfile
    args:
      # Optional only. The Dockerfile stamps commit/version from the git
      # checkout when .git is present, so a stale Coolify SOURCE_COMMIT /
      # APP_VERSION env cannot mislabel a newer binary. Pass APP_VERSION
      # only when you want a human release tag (e.g. v1.2.3) instead of the SHA.
      VERSION: ${APP_VERSION:-}
      COMMIT: ${SOURCE_COMMIT:-}
      BUILD_TIME: ${BUILD_TIME:-}
  image: nostrmash:coolify
  restart: unless-stopped
  init: true
  # Coolify's app-level Resource Limits UI does not apply per Compose service.
  # These cgroup caps survive redeploy; override via env if needed.
  mem_limit: ${NOSTRMASH_SERVICE_MEM_LIMIT:-512m}

# Liveness only (process is listening). Coolify Compose applications have no
# per-service Healthcheck UI — they show "unknown" until Compose defines one.
# Do not probe /ready here: a Postgres blip would mark the container unhealthy.
x-http-healthcheck: &http-healthcheck
  interval: 15s
  timeout: 3s
  retries: 5
  start_period: 60s

x-common-env: &common-env
  DATABASE_URL: ${DATABASE_URL}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  ENVIRONMENT: ${ENVIRONMENT:-production}
  APP_VERSION: ${APP_VERSION:-coolify}
  MEILI_ENABLED: ${MEILI_ENABLED:-false}
  MEILI_URL: ${MEILI_URL:-http://meilisearch:7700}
  MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-}
  MEILI_SEARCH_API_KEY: ${MEILI_SEARCH_API_KEY:-}

services:
  meilisearch:
    image: getmeili/meilisearch:v1.42.1
    restart: unless-stopped
    init: true
    expose:
      - "7700"
    # Single-server budget: keep Meili from evicting Postgres page cache.
    # Shrink the index below ~10GB before relying on this cap under load.
    mem_limit: ${MEILI_MEM_LIMIT:-6g}
    environment:
      MEILI_ENV: production
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_MAX_INDEXING_MEMORY: ${MEILI_MAX_INDEXING_MEMORY:-2GiB}
    volumes:
      - meili_data_v2:/meili_data
    # Official image ships wget. /health is unauthenticated and stays 200
    # while the process is up, including during index reopen after a restart.
    # start_period covers the 12GB production index cold-open.
    healthcheck:
      <<: *http-healthcheck
      start_period: 180s
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:7700/health"]

  api:
    <<: *nostrmash-service
    command: ["/app/api"]
    expose:
      - "8080"
    environment:
      <<: *common-env
      HTTP_ADDR: ":8080"
      # Cap pool size on the single-server host so raised work_mem stays safe.
      DATABASE_MAX_CONNS: ${API_DATABASE_MAX_CONNS:-32}
      ADMIN_BEARER_TOKEN: ${ADMIN_BEARER_TOKEN}
      API_MAX_BATCH_SIZE: ${API_MAX_BATCH_SIZE:-200}
      HTTP_RATE_LIMIT_RPM: ${HTTP_RATE_LIMIT_RPM:-240}
      HTTP_RATE_LIMIT_BURST: ${HTTP_RATE_LIMIT_BURST:-60}
      HTTP_SEARCH_RATE_LIMIT_RPM: ${HTTP_SEARCH_RATE_LIMIT_RPM:-60}
      HTTP_BATCH_RATE_LIMIT_RPM: ${HTTP_BATCH_RATE_LIMIT_RPM:-40}
      HTTP_DM_COMPAT_RATE_LIMIT_RPM: ${HTTP_DM_COMPAT_RATE_LIMIT_RPM:-30}
      INGESTOR_RELAY_URLS: ${INGESTOR_RELAY_URLS}
      INGESTOR_RELAY_DISABLED: ${INGESTOR_RELAY_DISABLED:-}
      PRIMAL_WS_ALLOWED_ORIGINS: ${PRIMAL_WS_ALLOWED_ORIGINS:-}
      PRIMAL_WS_ALLOW_ANY_ORIGIN: ${PRIMAL_WS_ALLOW_ANY_ORIGIN:-false}
      PRIMAL_WS_MAX_MESSAGE_BYTES: ${PRIMAL_WS_MAX_MESSAGE_BYTES:-1048576}
      PRIMAL_WS_MAX_REQ_PER_MINUTE: ${PRIMAL_WS_MAX_REQ_PER_MINUTE:-240}
      PRIMAL_WS_MAX_SUBSCRIPTIONS: ${PRIMAL_WS_MAX_SUBSCRIPTIONS:-200}
      PRIMAL_WS_REQUEST_TIMEOUT: ${PRIMAL_WS_REQUEST_TIMEOUT:-10s}
    healthcheck:
      <<: *http-healthcheck
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]

  ingestor:
    <<: *nostrmash-service
    command: ["/app/ingestor"]
    environment:
      <<: *common-env
      METRICS_ADDR: ${INGESTOR_METRICS_ADDR:-:9090}
      INGESTOR_MODE: ${INGESTOR_MODE:-live}
      INGESTOR_FILTER_GROUP: ${INGESTOR_FILTER_GROUP:-default_v1}
      INGESTOR_FILTER_GROUPS_JSON: ${INGESTOR_FILTER_GROUPS_JSON:-}
      INGESTOR_RELAY_URLS: ${INGESTOR_RELAY_URLS}
      INGESTOR_RELAY_ALLOWLIST: ${INGESTOR_RELAY_ALLOWLIST}
      INGESTOR_RELAY_DISABLED: ${INGESTOR_RELAY_DISABLED:-}
      INGESTOR_RELAY_REQUIRE_TLS: ${INGESTOR_RELAY_REQUIRE_TLS:-true}
      INGESTOR_RELAY_CONNECT_TIMEOUT: ${INGESTOR_RELAY_CONNECT_TIMEOUT:-10s}
      INGESTOR_RELAY_BACKOFF_INITIAL: ${INGESTOR_RELAY_BACKOFF_INITIAL:-1s}
      INGESTOR_RELAY_BACKOFF_MAX: ${INGESTOR_RELAY_BACKOFF_MAX:-30s}
      INGESTOR_RELAY_LAG_THRESHOLD: ${INGESTOR_RELAY_LAG_THRESHOLD:-45s}
      INGESTOR_LIVE_BOOTSTRAP_LOOKBACK_SECONDS: ${INGESTOR_LIVE_BOOTSTRAP_LOOKBACK_SECONDS:-300}
      INGESTOR_LIVE_RESUME_OVERLAP_SECONDS: ${INGESTOR_LIVE_RESUME_OVERLAP_SECONDS:-60}
      INGESTOR_BACKFILL_ENABLED: ${INGESTOR_BACKFILL_ENABLED:-false}
      INGESTOR_BACKFILL_MODE: ${INGESTOR_BACKFILL_MODE:-backfill}
      INGESTOR_BACKFILL_SINCE: ${INGESTOR_BACKFILL_SINCE:-}
      INGESTOR_BACKFILL_UNTIL: ${INGESTOR_BACKFILL_UNTIL:-}
      INGESTOR_BACKFILL_PAGE_LIMIT: ${INGESTOR_BACKFILL_PAGE_LIMIT:-500}
      INGESTOR_BACKFILL_CONNECT_TIMEOUT: ${INGESTOR_BACKFILL_CONNECT_TIMEOUT:-10s}
      INGESTOR_BACKFILL_IDLE_TIMEOUT: ${INGESTOR_BACKFILL_IDLE_TIMEOUT:-3s}
      INGESTOR_BACKFILL_EMPTY_PAGE_MAX: ${INGESTOR_BACKFILL_EMPTY_PAGE_MAX:-2}
      INGESTOR_REPLAY_FIXTURE_PATH: ${INGESTOR_REPLAY_FIXTURE_PATH:-}
      RELAY_REGISTRY_ENABLED: ${RELAY_REGISTRY_ENABLED:-false}
      RELAY_REGISTRY_RECONCILE_POLL_INTERVAL: ${RELAY_REGISTRY_RECONCILE_POLL_INTERVAL:-30s}
      RELAY_REGISTRY_RECONCILE_DRAIN_TIMEOUT: ${RELAY_REGISTRY_RECONCILE_DRAIN_TIMEOUT:-10s}
    healthcheck:
      <<: *http-healthcheck
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/metrics"]

  worker:
    <<: *nostrmash-service
    command: ["/app/worker"]
    environment:
      <<: *common-env
      METRICS_ADDR: ${WORKER_METRICS_ADDR:-:9090}
      DEBUG_ADDR: ${WORKER_DEBUG_ADDR:-}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
      # Tight terminal-job retention keeps the jobs indexes from bloating under
      # high churn on the single-server host (heap is tiny; indexes were 4.7 GB).
      WORKER_JOB_RETENTION_SUCCEEDED_MAX_AGE: ${WORKER_JOB_RETENTION_SUCCEEDED_MAX_AGE:-6h}
      WORKER_JOB_RETENTION_DEAD_MAX_AGE: ${WORKER_JOB_RETENTION_DEAD_MAX_AGE:-168h}
      WORKER_JOB_RETENTION_DELETE_BATCH_LIMIT: ${WORKER_JOB_RETENTION_DELETE_BATCH_LIMIT:-20000}
      # Storage governor budget. Default 50 GiB; size to ~80% of the volume
      # backing Postgres. 0 disables all defensive actions (observe-only).
      STORAGE_PRESSURE_CAPACITY_BYTES: ${STORAGE_PRESSURE_CAPACITY_BYTES:-53687091200}
      STORAGE_PRESSURE_WARN_PERCENT: ${STORAGE_PRESSURE_WARN_PERCENT:-80}
      STORAGE_PRESSURE_AGGRESSIVE_PERCENT: ${STORAGE_PRESSURE_AGGRESSIVE_PERCENT:-90}
      STORAGE_PRESSURE_DISABLE_HYDRATION_PERCENT: ${STORAGE_PRESSURE_DISABLE_HYDRATION_PERCENT:-95}
      STORAGE_PRESSURE_PAUSE_CANDIDATE_PERCENT: ${STORAGE_PRESSURE_PAUSE_CANDIDATE_PERCENT:-98}
      RELAY_REGISTRY_ENABLED: ${RELAY_REGISTRY_ENABLED:-false}
      RELAY_REGISTRY_SEED_RELAYS: ${RELAY_REGISTRY_SEED_RELAYS:-}
      RELAY_REGISTRY_ALLOW_PRIVATE_NETWORK: ${RELAY_REGISTRY_ALLOW_PRIVATE_NETWORK:-false}
      RELAY_REGISTRY_REFRESH_INTERVAL: ${RELAY_REGISTRY_REFRESH_INTERVAL:-5m}
      RELAY_REGISTRY_DISCOVERY_ENABLED: ${RELAY_REGISTRY_DISCOVERY_ENABLED:-false}
      RELAY_REGISTRY_DISCOVERY_MIN_DISTINCT_USER_REFS: ${RELAY_REGISTRY_DISCOVERY_MIN_DISTINCT_USER_REFS:-3}
      RELAY_REGISTRY_DISCOVERY_MAX_NEW_CANDIDATES: ${RELAY_REGISTRY_DISCOVERY_MAX_NEW_CANDIDATES:-25}
      RELAY_REGISTRY_PROBING_ENABLED: ${RELAY_REGISTRY_PROBING_ENABLED:-false}
      RELAY_REGISTRY_PROBING_INTERVAL: ${RELAY_REGISTRY_PROBING_INTERVAL:-5m}
      RELAY_REGISTRY_PROBING_TIMEOUT_CONNECT: ${RELAY_REGISTRY_PROBING_TIMEOUT_CONNECT:-10s}
      RELAY_REGISTRY_PROBING_TIMEOUT_EOSE: ${RELAY_REGISTRY_PROBING_TIMEOUT_EOSE:-15s}
      RELAY_REGISTRY_PROBING_MAX_PARALLEL: ${RELAY_REGISTRY_PROBING_MAX_PARALLEL:-5}
      RELAY_REGISTRY_ADMISSION_MAX_TOTAL_ACTIVE: ${RELAY_REGISTRY_ADMISSION_MAX_TOTAL_ACTIVE:-20}
      RELAY_REGISTRY_ADMISSION_MAX_DYNAMIC_ACTIVE: ${RELAY_REGISTRY_ADMISSION_MAX_DYNAMIC_ACTIVE:-15}
      RELAY_REGISTRY_ADMISSION_MAX_PROBATION: ${RELAY_REGISTRY_ADMISSION_MAX_PROBATION:-20}
      RELAY_REGISTRY_ADMISSION_MIN_SCORE_PROBATION: ${RELAY_REGISTRY_ADMISSION_MIN_SCORE_PROBATION:-10}
      RELAY_REGISTRY_ADMISSION_MIN_SCORE_ACTIVE: ${RELAY_REGISTRY_ADMISSION_MIN_SCORE_ACTIVE:-30}
      RELAY_REGISTRY_ADMISSION_DEMOTE_FAILURE_THRESHOLD: ${RELAY_REGISTRY_ADMISSION_DEMOTE_FAILURE_THRESHOLD:-60}
    healthcheck:
      <<: *http-healthcheck
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/metrics"]

  trust_worker:
    <<: *nostrmash-service
    command: ["/app/trust_worker"]
    # Redis graph sync + in-memory score compute stream ~5M follower_edges;
    # 256m OOMs / Redis client timeouts mid-compute. Keep under the single-server
    # RAM budget but large enough for a full adjacency load.
    mem_limit: ${TRUST_WORKER_MEM_LIMIT:-2g}
    environment:
      <<: *common-env
      METRICS_ADDR: ${TRUST_WORKER_METRICS_ADDR:-:9090}
      DEBUG_ADDR: ${TRUST_WORKER_DEBUG_ADDR:-}
      TRUST_REDIS_URL: ${TRUST_REDIS_URL:-}
      TRUST_WORKER_CONCURRENCY: ${TRUST_WORKER_CONCURRENCY:-2}
      TRUST_WORKER_CLAIM_BATCH_SIZE: ${TRUST_WORKER_CLAIM_BATCH_SIZE:-5}
      TRUST_WORKER_POLL_INTERVAL: ${TRUST_WORKER_POLL_INTERVAL:-1s}
      TRUST_WORKER_RETRY_DELAY: ${TRUST_WORKER_RETRY_DELAY:-5s}
      TRUST_ENABLE_SCORE_COMPUTE: ${TRUST_ENABLE_SCORE_COMPUTE:-true}
      TRUST_ENABLE_REDIS_SYNC: ${TRUST_ENABLE_REDIS_SYNC:-false}
      WORKER_JOB_RETENTION_SUCCEEDED_MAX_AGE: ${WORKER_JOB_RETENTION_SUCCEEDED_MAX_AGE:-6h}
      WORKER_JOB_RETENTION_DEAD_MAX_AGE: ${WORKER_JOB_RETENTION_DEAD_MAX_AGE:-168h}
      WORKER_JOB_RETENTION_DELETE_BATCH_LIMIT: ${WORKER_JOB_RETENTION_DELETE_BATCH_LIMIT:-20000}
    healthcheck:
      <<: *http-healthcheck
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/metrics"]

volumes:
  meili_data_v2:
