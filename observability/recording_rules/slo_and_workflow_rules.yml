groups:
  - name: nostrmash-slo-recording
    interval: 30s
    rules:
      - record: nostrmash:api:requests:rate5m
        expr: sum(rate(nostrmash_api_requests_total{path_template=~"/api/v1/.*|/primal/v1/.*"}[5m]))

      - record: nostrmash:api:errors_5xx:rate5m
        expr: sum(rate(nostrmash_api_requests_total{path_template=~"/api/v1/.*|/primal/v1/.*",status_code=~"5.."}[5m]))

      - record: nostrmash:api:error_ratio5m
        expr: nostrmash:api:errors_5xx:rate5m / clamp_min(nostrmash:api:requests:rate5m, 0.001)

      # Excludes /api/v1/search: search latency is dominated by Meilisearch
      # health/load, a fundamentally different failure mode from these
      # pure-Postgres metadata lookups. Mixing them into one p95 previously
      # made this alert flap for days whenever Meilisearch was under
      # pressure (e.g. a startup FullSync) while the metadata routes it was
      # meant to watch stayed healthy the whole time, and made root-causing
      # slower because the alert gave no signal about which failure mode was
      # active. See nostrmash:api:search_latency_p95_seconds:5m for search.
      - record: nostrmash:api:critical_path_latency_p95_seconds:5m
        expr: histogram_quantile(0.95, sum by (le) (rate(nostrmash_api_request_duration_seconds_bucket{path_template=~"/api/v1/events/\\{id\\}|/api/v1/threads/\\{eventId\\}|/api/v1/profiles/\\{pubkey\\}"}[5m])))

      - record: nostrmash:api:search_latency_p95_seconds:5m
        expr: histogram_quantile(0.95, sum by (le) (rate(nostrmash_api_request_duration_seconds_bucket{path_template="/api/v1/search"}[5m])))

      - record: nostrmash:db_pool:max_open_usage_ratio
        expr: max(nostrmash_db_pool_max_open_usage_ratio)

      - record: nostrmash:db_pool:wait_rate5m
        expr: sum(rate(nostrmash_db_pool_wait_count_total[5m]))

      - record: nostrmash:worker:terminal_jobs_total:increase30m
        expr: sum(increase(nostrmash_worker_jobs_total{outcome=~"succeeded|dead"}[30m]))

      - record: nostrmash:worker:dead_ratio30m
        expr: sum(increase(nostrmash_worker_jobs_total{outcome="dead"}[30m])) / clamp_min(nostrmash:worker:terminal_jobs_total:increase30m, 1)

      - record: nostrmash:worker:retry_ratio15m
        expr: sum(increase(nostrmash_worker_jobs_total{outcome="retry"}[15m])) / clamp_min(sum(increase(nostrmash_worker_jobs_total{outcome=~"succeeded|dead|retry"}[15m])), 1)

      - record: nostrmash:queue:claim_errors_rate5m
        expr: sum(rate(nostrmash_queue_operation_errors_total{operation="claim_available"}[5m]))

      - record: nostrmash:ingest:valid_or_duplicate_rate30m
        expr: sum(rate(nostrmash_ingest_events_total{outcome=~"valid|duplicate"}[30m]))

      - record: nostrmash:ingest:checkpoint_freshness_seconds:max
        expr: max(nostrmash_ingest_checkpoint_freshness_seconds{mode="live"})

      - record: nostrmash:worker:queue_backlog_oldest_pending_age_seconds
        expr: max(nostrmash_worker_queue_backlog_oldest_pending_age_seconds)

      - record: nostrmash:rebuild:active_runs
        expr: max(nostrmash_rebuild_runs_active)

      - record: nostrmash:rebuild:active_oldest_age_seconds
        expr: max(nostrmash_rebuild_active_oldest_age_seconds)

      - record: nostrmash:rebuild:job_latency_p95_seconds:30m
        expr: histogram_quantile(0.95, sum by (le) (rate(nostrmash_worker_job_execution_duration_seconds_bucket{job_type="rebuild_projection_scope"}[30m])))

      - record: nostrmash:trust:queue_backlog_oldest_pending_age_seconds
        expr: max(nostrmash_trust_queue_backlog_oldest_pending_age_seconds)

      - record: nostrmash:trust:active_runs
        expr: max(nostrmash_trust_runs_active)

      - record: nostrmash:trust:active_oldest_run_age_seconds
        expr: max(nostrmash_trust_active_oldest_run_age_seconds)

      - record: nostrmash:trust:active_snapshot_age_seconds
        expr: max(nostrmash_trust_active_snapshot_age_seconds)

      - record: nostrmash:discovery:relay_window_snapshot_age_seconds
        expr: max(nostrmash_relay_window_snapshot_age_seconds)

      - record: nostrmash:trust:phase_retry_ratio15m
        expr: sum(increase(nostrmash_worker_jobs_total{job_type=~"trust_.*",outcome="retry"}[15m])) / clamp_min(sum(increase(nostrmash_worker_jobs_total{job_type=~"trust_.*",outcome=~"succeeded|dead|retry"}[15m])), 1)

      - record: nostrmash:lookup:fallback_attempt_rate5m_by_entity
        expr: sum by (entity) (rate(nostrmash_lookup_fallback_total{result="attempt"}[5m]))

      - record: nostrmash:lookup:fallback_error_ratio5m_by_entity
        expr: sum by (entity) (rate(nostrmash_lookup_fallback_total{result="error"}[5m])) / clamp_min(nostrmash:lookup:fallback_attempt_rate5m_by_entity, 0.001)

      - record: nostrmash:lookup:fallback_miss_ratio5m_by_entity
        expr: sum by (entity) (rate(nostrmash_lookup_fallback_total{result="miss"}[5m])) / clamp_min(nostrmash:lookup:fallback_attempt_rate5m_by_entity, 0.001)

      - record: nostrmash:lookup:fallback_latency_p95_seconds:5m_by_entity
        expr: histogram_quantile(0.95, sum by (entity, le) (rate(nostrmash_lookup_fallback_latency_seconds_bucket[5m])))

      - record: nostrmash:lookup:local_total_rate5m_by_surface
        expr: sum by (surface) (rate(nostrmash_lookup_local_total[5m]))

      - record: nostrmash:lookup:local_miss_ratio5m_by_surface
        expr: sum by (surface) (rate(nostrmash_lookup_local_total{result="miss"}[5m])) / clamp_min(nostrmash:lookup:local_total_rate5m_by_surface, 0.001)

      - record: nostrmash:storage:database_growth_bytes_per_hour:6h
        expr: deriv(nostrmash_storage_database_bytes[6h]) * 3600

      - record: nostrmash:storage:heavy_table_growth_bytes_per_hour:6h
        expr: deriv(nostrmash_storage_table_bytes{table=~"events|event_tags|invalid_events|jobs|trust_scores_global"}[6h]) * 3600

      - record: nostrmash:retention:purge_error_rate5m
        expr: sum(rate(nostrmash_retention_purge_runs_total{result="error"}[5m]))

      - record: nostrmash:retention:purged_rows_rate1h_by_target
        expr: sum by (target) (rate(nostrmash_retention_purged_rows_total[1h]))

      # p95 latency of retention/store purge ops. Used to catch the
      # "batch cost grows with table size" failure mode before catchup
      # stretches into days/weeks. Labels match ObserveDBOperation names.
      - record: nostrmash:retention:batch_duration_p95_seconds:6h
        expr: histogram_quantile(0.95, sum by (operation, le) (rate(nostrmash_db_operation_duration_seconds_bucket{operation=~"purge_.*|prune_.*|groom_.*"}[6h])))

      - record: nostrmash:retention:batch_duration_p95_seconds:24h
        expr: histogram_quantile(0.95, sum by (operation, le) (rate(nostrmash_db_operation_duration_seconds_bucket{operation=~"purge_.*|prune_.*|groom_.*"}[24h])))
