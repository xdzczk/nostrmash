groups:
  - name: nostrmash-core-workflows
    interval: 30s
    rules:
      - alert: NostrMashAPIHighErrorRate
        expr: nostrmash:api:error_ratio5m > 0.01
        for: 15m
        labels:
          severity: warning
          slo: api-availability
        annotations:
          summary: "API 5xx error ratio is above 1%"
          description: "Sustained 5xx error ratio (5m) is above 1% for 15m. Follow API availability SLO triage in docs/operations.md."
          runbook: "docs/operations.md#alert-response-playbook"

      - alert: NostrMashAPICriticalPathLatencyHigh
        expr: nostrmash:api:critical_path_latency_p95_seconds:5m > 1.5
        for: 10m
        labels:
          severity: warning
          slo: api-latency
        annotations:
          summary: "API critical-path p95 latency is high"
          description: "Critical-route p95 latency exceeds 1.5s for 10m. Check DB pool pressure and query/store trace spans."
          runbook: "docs/operations.md#alert-response-playbook"

      - alert: NostrMashDBPoolSaturation
        expr: nostrmash:db_pool:max_open_usage_ratio > 0.90 and nostrmash:db_pool:wait_rate5m > 0.20
        for: 10m
        labels:
          severity: warning
          slo: api-latency
        annotations:
          summary: "DB pool saturation is sustained"
          description: "Pool usage ratio > 0.90 with non-trivial wait rate for 10m. Investigate slow queries and pool tuning."
          runbook: "docs/operations.md#alert-response-playbook"

      - alert: NostrMashWorkerDeadLetterRateHigh
        expr: nostrmash:worker:dead_ratio30m > 0.01 and nostrmash:worker:terminal_jobs_total:increase30m > 20
        for: 30m
        labels:
          severity: warning
          slo: worker-throughput
        annotations:
          summary: "Worker dead-letter ratio exceeds SLO threshold"
          description: "Dead-letter ratio over 30m is above 1% with meaningful volume. Inspect derivation failures and queue transitions."
          runbook: "docs/operations.md#alert-response-playbook"

      - alert: NostrMashWorkerRetryStorm
        expr: nostrmash:worker:retry_ratio15m > 0.30 and sum(increase(nostrmash_worker_jobs_total{outcome=~"succeeded|dead|retry"}[15m])) > 30
        for: 15m
        labels:
          severity: warning
          slo: worker-throughput
        annotations:
          summary: "Worker retries dominate recent job outcomes"
          description: "Retry ratio >30% in 15m. Look for derivation regressions, dependency errors, or queue contention."
          runbook: "docs/operations.md#alert-response-playbook"

      - alert: NostrMashQueueClaimErrorsHigh
        expr: nostrmash:queue:claim_errors_rate5m > 0.05
        for: 15m
        labels:
          severity: warning
          slo: worker-throughput
        annotations:
          summary: "Queue claim operation is erroring"
          description: "Claim operation errors are sustained. Check DB connectivity, lock contention, and queue table health."
          runbook: "docs/operations.md#alert-response-playbook"

      - alert: NostrMashIngestLikelyStalled
        expr: nostrmash:ingest:checkpoint_freshness_seconds:max > 600
        for: 10m
        labels:
          severity: warning
          slo: ingest-freshness
        annotations:
          summary: "Ingest checkpoint freshness is stale"
          description: "Live checkpoint freshness exceeded 10 minutes for 10m. Investigate relay connectivity and ingest loop health."
          runbook: "docs/operations.md#alert-response-playbook"

      - alert: NostrMashRebuildProcessingSlow
        expr: nostrmash:rebuild:active_runs > 0 and nostrmash:rebuild:active_oldest_age_seconds > 1800
        for: 15m
        labels:
          severity: warning
          slo: rebuild-completion
        annotations:
          summary: "Active rebuild age is elevated"
          description: "At least one rebuild run has been active for over 30 minutes. Investigate rebuild state and queue pressure."
          runbook: "docs/operations.md#alert-response-playbook"

      - alert: NostrMashRebuildJobsDead
        expr: increase(nostrmash_worker_jobs_total{job_type="rebuild_projection_scope",outcome="dead"}[30m]) > 0
        for: 5m
        labels:
          severity: critical
          slo: rebuild-completion
        annotations:
          summary: "Rebuild jobs are dead-lettering"
          description: "At least one rebuild projection-scope job dead-lettered in 30m. Treat as rebuild recovery incident."
          runbook: "docs/operations.md#alert-response-playbook"

      - alert: NostrMashTrustRunStuck
        expr: nostrmash:trust:active_runs > 0 and nostrmash:trust:active_oldest_run_age_seconds > 1800
        for: 15m
        labels:
          severity: warning
          slo: worker-throughput
        annotations:
          summary: "Trust run appears stuck"
          description: "At least one trust run has remained active for over 30 minutes. Inspect trust phase metadata and trust queue health."
          runbook: "docs/operations.md#alert-response-playbook"

      - alert: NostrMashTrustSnapshotStale
        expr: nostrmash:trust:active_snapshot_age_seconds > 21600
        for: 30m
        labels:
          severity: warning
          slo: worker-throughput
        annotations:
          summary: "Trust snapshot is stale"
          description: "Most recent succeeded trust run is older than 6 hours. Trigger a trust run and verify trust_worker health."
          runbook: "docs/operations.md#alert-response-playbook"

      - alert: NostrMashTrustRetryStorm
        expr: nostrmash:trust:phase_retry_ratio15m > 0.30 and sum(increase(nostrmash_worker_jobs_total{job_type=~"trust_.*",outcome=~"succeeded|dead|retry"}[15m])) > 20
        for: 15m
        labels:
          severity: warning
          slo: worker-throughput
        annotations:
          summary: "Trust phase retries dominate recent outcomes"
          description: "Trust retry ratio exceeded 30% over 15m with meaningful volume. Inspect sync/compute/promote errors by phase."
          runbook: "docs/operations.md#alert-response-playbook"

      - alert: NostrMashFallbackFailureRatioHigh
        expr: nostrmash:lookup:fallback_failure_or_miss_ratio5m_by_surface > 0.30 and nostrmash:lookup:fallback_attempt_rate5m_by_surface > 0.05
        for: 15m
        labels:
          severity: warning
          slo: api-latency
        annotations:
          summary: "Relay fallback failures/misses are sustained"
          description: "Fallback failure+miss ratio exceeds 30% with meaningful traffic for 15m. Inspect relay health, fallback timeout/fanout, and local miss behavior."
          runbook: "docs/operations.md#alert-response-playbook"

      - alert: NostrMashFallbackLatencyHigh
        expr: nostrmash:lookup:fallback_latency_p95_seconds:5m_by_surface > 1.5 and nostrmash:lookup:fallback_attempt_rate5m_by_surface > 0.05
        for: 10m
        labels:
          severity: warning
          slo: api-latency
        annotations:
          summary: "Relay fallback latency p95 is elevated"
          description: "Fallback lookup p95 latency exceeds 1.5s with sustained volume. Check relay response behavior and fallback timeout budget."
          runbook: "docs/operations.md#alert-response-playbook"

      - alert: NostrMashLocalMissRatioHigh
        expr: nostrmash:lookup:local_miss_ratio5m_by_surface > 0.50 and nostrmash:lookup:local_total_rate5m_by_surface > 0.05
        for: 20m
        labels:
          severity: warning
          slo: api-availability
        annotations:
          summary: "Local lookup miss ratio is elevated"
          description: "More than half of fallback-enabled lookups are local misses for 20m. Investigate ingest freshness and hot-data locality."
          runbook: "docs/operations.md#alert-response-playbook"

      - alert: NostrMashRetentionPurgeFailing
        expr: nostrmash:retention:purge_error_rate5m > 0
        for: 15m
        labels:
          severity: warning
          slo: worker-throughput
        annotations:
          summary: "Retention purge loop is failing"
          description: "Retention purge runs are erroring over 15m. Inspect worker logs and retention configuration for jobs/invalid_events."
          runbook: "docs/operations.md#alert-response-playbook"

      - alert: NostrMashDatabaseGrowthSustained
        expr: nostrmash:storage:database_growth_bytes_per_hour:6h > 52428800
        for: 6h
        labels:
          severity: warning
          slo: capacity-planning
        annotations:
          summary: "Database storage growth is sustained"
          description: "Database size growth exceeds 50 MiB/hour over a 6h derivative window. Review high-growth tables and retention posture."
          runbook: "docs/operations.md#alert-response-playbook"

      - alert: NostrMashInvalidEventsGrowthHigh
        expr: nostrmash:storage:heavy_table_growth_bytes_per_hour:6h{table="invalid_events"} > 10485760
        for: 6h
        labels:
          severity: warning
          slo: capacity-planning
        annotations:
          summary: "invalid_events table growth is elevated"
          description: "invalid_events growth exceeds 10 MiB/hour over 6h. Check malformed traffic/relays and invalid_events retention effectiveness."
          runbook: "docs/operations.md#alert-response-playbook"
