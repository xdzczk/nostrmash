# Scrape config for the single-server Coolify deployment.
# Targets use Docker DNS names within the Coolify/Docker network.
# Override via environment substitution is not supported by Prometheus natively;
# edit the hostnames below if your Coolify service aliases differ.
#
# Expected aliases (same Docker network as the nostrmash app stack):
#   api, worker, ingestor, trust_worker
# Coolify may also expose longer container names; prefer Compose service names
# when the monitoring stack joins the app stack network.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: nostrmash
    env: production

rule_files:
  - /etc/prometheus/rules/*.yml
  - /etc/prometheus/alerts/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: nostrmash-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8080"]
        labels:
          binary_role: api

  - job_name: nostrmash-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:9090"]
        labels:
          binary_role: worker

  - job_name: nostrmash-ingestor
    metrics_path: /metrics
    static_configs:
      - targets: ["ingestor:9090"]
        labels:
          binary_role: ingestor

  - job_name: nostrmash-trust-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["trust_worker:9090"]
        labels:
          binary_role: trust_worker
