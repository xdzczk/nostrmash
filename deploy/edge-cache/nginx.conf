# Local edge cache in front of the API. Honors origin Cache-Control /
# CDN-Cache-Control so discovery TTLs stay aligned with the in-process cache.
# WebSocket upgrades, admin, health, and authenticated paths are never cached.
worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;

    proxy_cache_path /var/cache/nginx/discovery
        levels=1:2
        keys_zone=discovery:16m
        max_size=256m
        inactive=2h
        use_temp_path=off;

    upstream api {
        server api:8080;
        keepalive 16;
    }

    server {
        listen 8080;
        server_name _;

        # Liveness for Coolify. Proxied so a dead API fails the edge too.
        location = /health {
            proxy_pass http://api;
            proxy_cache off;
        }

        location = /primal/ws {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_cache off;
        }

        location /api/v1/discovery/ {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            proxy_cache discovery;
            proxy_cache_key $scheme$proxy_host$request_uri$http_accept_encoding;
            proxy_cache_methods GET HEAD;
            proxy_cache_valid 200 60s;
            proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
            proxy_cache_background_update on;
            proxy_cache_lock on;
            proxy_ignore_headers Set-Cookie;
            add_header X-Edge-Cache $upstream_cache_status always;
            add_header Vary Accept-Encoding always;
        }

        location / {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_cache off;
        }
    }
}
