services:
  postgres:
    image: postgres:18-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: nostrmash
      POSTGRES_PASSWORD: nostrmash
      POSTGRES_DB: nostrmash
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nostrmash -d nostrmash"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  meilisearch:
    image: getmeili/meilisearch:v1.14
    ports:
      - "7700:7700"
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: nostrmash-dev-key
    volumes:
      - meili_data:/meili_data

  api:
    build: .
    image: nostrmash:dev
    command: ["/app/api"]
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://nostrmash:nostrmash@postgres:5432/nostrmash?sslmode=disable
      HTTP_ADDR: ":8080"
      LOG_LEVEL: info
      ENVIRONMENT: development
      APP_VERSION: dev
      MEILI_ENABLED: "true"
      MEILI_URL: http://meilisearch:7700
      MEILI_MASTER_KEY: nostrmash-dev-key
    depends_on:
      postgres:
        condition: service_healthy

  ingestor:
    image: nostrmash:dev
    build: .
    command: ["/app/ingestor"]
    environment:
      DATABASE_URL: postgres://nostrmash:nostrmash@postgres:5432/nostrmash?sslmode=disable
      LOG_LEVEL: info
      ENVIRONMENT: development
      INGESTOR_MODE: live
      INGESTOR_FILTER_GROUP: default_v1
      INGESTOR_RELAY_URLS: wss://relay.primal.net,wss://relay.damus.io,wss://nos.lol
      INGESTOR_RELAY_ALLOWLIST: wss://relay.primal.net,wss://relay.damus.io,wss://nos.lol
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    image: nostrmash:dev
    build: .
    command: ["/app/worker"]
    environment:
      DATABASE_URL: postgres://nostrmash:nostrmash@postgres:5432/nostrmash?sslmode=disable
      LOG_LEVEL: info
      ENVIRONMENT: development
      MEILI_ENABLED: "true"
      MEILI_URL: http://meilisearch:7700
      MEILI_MASTER_KEY: nostrmash-dev-key
    depends_on:
      postgres:
        condition: service_healthy

  trust_worker:
    image: nostrmash:dev
    build: .
    command: ["/app/trust_worker"]
    environment:
      DATABASE_URL: postgres://nostrmash:nostrmash@postgres:5432/nostrmash?sslmode=disable
      TRUST_WORKER_CONCURRENCY: "2"
      TRUST_WORKER_CLAIM_BATCH_SIZE: "5"
      TRUST_ENABLE_SCORE_COMPUTE: "true"
      TRUST_ENABLE_REDIS_SYNC: "false"
      LOG_LEVEL: info
      ENVIRONMENT: development
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  meili_data:
